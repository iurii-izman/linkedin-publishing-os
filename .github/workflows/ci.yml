name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stage1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: publisher
          POSTGRES_PASSWORD: stage1-ci-publisher-only
          POSTGRES_DB: publisher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U publisher -d publisher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://publisher:stage1-ci-publisher-only@127.0.0.1:5432/publisher
      STAGE1_TEST_DATABASE_URL: postgresql+psycopg://publisher:stage1-ci-publisher-only@127.0.0.1:5432/publisher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run python scripts/validate_repository.py
      - run: uv run python -m compileall -q src
      - run: docker build -t linkedin-publishing-os:ci .
