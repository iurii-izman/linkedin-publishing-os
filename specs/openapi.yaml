openapi: 3.1.0
info:
  title: LinkedIn Publishing OS Internal API
  version: 1.0.0
  description: Internal API used by n8n. Access tokens are never returned.
servers:
  - url: https://publisher.example.com
security:
  - ServiceToken: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Process alive
          content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}
  /ready:
    get:
      security: []
      responses: {"200": {description: Ready}, "503": {description: Not ready}}
  /v1/oauth/linkedin/start:
    post:
      summary: Create one-time OAuth URL
      security:
        - Stage0OwnerKey: []
      responses:
        "200":
          description: URL
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_at]
                properties:
                  authorization_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        "401":
          description: Invalid Stage 0 owner key
  /v1/oauth/linkedin/callback:
    get:
      security: []
      parameters:
        - {in: query, name: code, schema: {type: string}}
        - {in: query, name: state, required: true, schema: {type: string}}
        - {in: query, name: error, schema: {type: string}}
        - {in: query, name: error_description, schema: {type: string}}
      description: Exactly one of code or error is expected. State is always consumed once.
      responses:
        "200":
          description: Completed without returning a token
          content: {application/json: {schema: {$ref: "#/components/schemas/OAuthSafeResult"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/UpstreamFailure"}
  /v1/integrations/linkedin/status:
    get:
      responses:
        "200":
          description: Safe status
          content: {application/json: {schema: {$ref: "#/components/schemas/IntegrationStatus"}}}
  /v1/sources:
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SourceCreate"}}}
      responses: {"201": {description: Created}, "200": {description: Duplicate returned}}
  /v1/content-items:
    post:
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ContentItemCreate"}}}
      responses:
        "201": {description: Created}
        "200": {description: Existing item returned for the same idempotency key}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/evidence-packs:
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/EvidencePackCreate"}}}
      responses: {"201": {description: Created}}
  /v1/drafts:
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/DraftCreate"}}}
      responses: {"201": {description: Created}}
  /v1/drafts/{draft_id}/qa:
    post:
      parameters: [{$ref: "#/components/parameters/DraftId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/QaSubmission"}}}
      responses: {"200": {description: QA finalized}, "409": {description: Invalid state}}
  /v1/drafts/{draft_id}/approve:
    post:
      parameters:
        - {$ref: "#/components/parameters/DraftId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ApprovalRequest"}}}
      responses: {"201": {description: Approved}, "409": {description: Not approvable}}
  /v1/drafts/{draft_id}/reject:
    post:
      parameters: [{$ref: "#/components/parameters/DraftId"}]
      responses: {"200": {description: Rejected}, "409": {description: Invalid state}}
  /v1/publication-jobs:
    post:
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PublicationJobCreate"}}}
      responses: {"201": {description: Scheduled}, "409": {description: Duplicate or invalid}}
  /v1/publication-jobs/execute-due:
    post:
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses: {"200": {description: Execution summaries}}
  /v1/publication-jobs/{job_id}/resolve-uncertain:
    post:
      parameters: [{$ref: "#/components/parameters/JobId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: {type: string, enum: [PUBLISHED, NOT_PUBLISHED]}
                linkedin_post_urn: {type: [string, "null"]}
      responses: {"200": {description: Resolved}, "409": {description: Not uncertain}}
  /v1/metrics/manual:
    post:
      responses: {"201": {description: Stored}}
  /v1/outbox:
    get:
      responses: {"200": {description: Pending events}}
  /v1/outbox/{event_id}/ack:
    post:
      parameters:
        - {in: path, name: event_id, required: true, schema: {type: string, format: uuid}}
      responses: {"200": {description: Acknowledged}}
components:
  securitySchemes:
    ServiceToken: {type: http, scheme: bearer}
    Stage0OwnerKey: {type: apiKey, in: header, name: X-Stage0-Owner-Key}
  parameters:
    DraftId: {in: path, name: draft_id, required: true, schema: {type: string, format: uuid}}
    JobId: {in: path, name: job_id, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  responses:
    BadRequest:
      description: Invalid request
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: State or idempotency conflict
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: Required OAuth scopes or verified token metadata are unavailable
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UpstreamFailure:
      description: Safe upstream failure without credentials or raw body
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    Error:
      type: object
      required: [code, message, correlation_id]
      additionalProperties: false
      properties:
        code: {type: string}
        message: {type: string}
        correlation_id: {type: string}
        details: {type: object}
    OAuthSafeResult:
      type: object
      required: [status, expires_at, granted_scopes, author_urn, api_version]
      additionalProperties: false
      properties:
        status: {type: string, enum: [connected_for_stage0, CONNECTED]}
        expires_at: {type: string, format: date-time}
        granted_scopes: {type: array, items: {type: string}}
        author_urn: {type: string, pattern: "^urn:li:person:"}
        api_version: {type: string, pattern: "^[0-9]{6}$"}
        requires_live_author_validation: {type: boolean}
    IntegrationStatus:
      type: object
      required: [status, api_version, capabilities]
      properties:
        status: {type: string, enum: [DISCONNECTED, CONNECTED, EXPIRING, AUTH_REQUIRED, REVOKED, MISCONFIGURED]}
        token_expires_at: {type: [string, "null"], format: date-time}
        api_version: {type: string}
        author_urn_present: {type: boolean}
        capabilities: {type: object, additionalProperties: {type: boolean}}
    SourceCreate:
      type: object
      required: [source_type, content_hash, visibility]
      properties:
        source_type: {type: string}
        canonical_url: {type: [string, "null"], format: uri}
        title: {type: [string, "null"]}
        raw_content: {type: [string, "null"]}
        content_hash: {type: string}
        trust_level: {type: integer, minimum: 0, maximum: 5}
        visibility: {type: string, enum: [PUBLIC, INTERNAL, PRIVATE]}
        metadata: {type: object}
    ContentItemCreate:
      type: object
      required: [topic, pillar, primary_source_id]
      additionalProperties: false
      properties:
        topic: {type: string, minLength: 1}
        pillar: {type: string, minLength: 1}
        primary_source_id: {type: string, format: uuid}
        scores: {type: object}
        risk_notes: {type: array, items: {type: string}}
    EvidencePackCreate:
      type: object
      required: [content_item_id, language, allowed_claim_ids, source_ids]
      properties:
        content_item_id: {type: string, format: uuid}
        language: {type: string, enum: [ru, en]}
        allowed_claim_ids: {type: array, items: {type: string}}
        forbidden_claim_keys: {type: array, items: {type: string}}
        source_ids: {type: array, items: {type: string, format: uuid}}
        warnings: {type: array, items: {type: string}}
    DraftCreate:
      type: object
      required: [content_item_id, evidence_pack_id, language, pillar, full_text, structured_content, used_claim_ids]
      properties:
        content_item_id: {type: string, format: uuid}
        evidence_pack_id: {type: string, format: uuid}
        parent_version_id: {type: [string, "null"], format: uuid}
        language: {type: string, enum: [ru, en]}
        pillar: {type: string}
        full_text: {type: string, minLength: 1}
        structured_content: {type: object}
        used_claim_ids: {type: array, items: {type: string}}
    QaSubmission:
      type: object
      required: [deterministic_result, deterministic_report, final_result]
      properties:
        deterministic_result: {type: string, enum: [PASS, PASS_WITH_WARNINGS, FAIL]}
        deterministic_report: {type: object}
        llm_result: {type: [string, "null"], enum: [PASS, PASS_WITH_WARNINGS, FAIL, null]}
        llm_report: {type: [object, "null"]}
        final_result: {type: string, enum: [PASS, PASS_WITH_WARNINGS, FAIL]}
    ApprovalRequest:
      type: object
      required: [approved_by]
      properties:
        asset_id: {type: [string, "null"], format: uuid}
        approved_by: {type: string}
        accepted_warning_codes: {type: array, items: {type: string}}
    PublicationJobCreate:
      type: object
      required: [approval_id, scheduled_at, visibility]
      properties:
        approval_id: {type: string, format: uuid}
        scheduled_at: {type: string, format: date-time}
        visibility: {type: string, enum: [PUBLIC]}
