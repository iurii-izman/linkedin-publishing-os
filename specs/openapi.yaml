openapi: 3.1.0
info:
  title: LinkedIn Publishing OS
  version: 0.3.0
  description: >
    Owner-only Stage 1 vertical API. All publication execution is disabled unless
    an explicit non-production fake adapter or separately approved live capability
    is configured. Tokens are never returned.
servers:
  - url: https://publisher.example.com
security:
  - OwnerKey: []
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
  /ready:
    get:
      security: []
      operationId: ready
      responses:
        "200": {description: Database and migration are ready}
        "503":
          description: Database unavailable or migration is not current
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
  /v1/oauth/linkedin/start:
    post:
      security:
        - Stage0OwnerKey: []
      operationId: stage0OAuthStart
      responses:
        "200": {description: Stage 0 authorization URL created}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/oauth/linkedin/callback:
    get:
      security: []
      operationId: stage0OAuthCallback
      parameters:
        - {in: query, name: state, required: true, schema: {type: string, minLength: 20}}
        - {in: query, name: code, schema: {type: [string, "null"]}}
        - {in: query, name: error, schema: {type: [string, "null"]}}
        - {in: query, name: error_description, schema: {type: [string, "null"]}}
      responses:
        "200": {description: Stage 0 connection encrypted locally}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {description: Safe upstream OAuth failure}
  /v1/drafts:
    post:
      operationId: createDraft
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DraftCreate"}
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Draft"}
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Draft"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /v1/drafts/{draft_id}:
    get:
      operationId: getDraft
      parameters:
        - {$ref: "#/components/parameters/DraftId"}
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Draft"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/drafts/{draft_id}/revisions:
    post:
      operationId: createRevision
      parameters:
        - {$ref: "#/components/parameters/DraftId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevisionCreate"}
      responses:
        "201":
          description: Immutable revision created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Revision"}
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Revision"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
    get:
      operationId: listRevisions
      parameters:
        - {$ref: "#/components/parameters/DraftId"}
      responses:
        "200":
          description: Revisions in ascending revision order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Revision"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/revisions/{revision_id}:
    get:
      operationId: getRevision
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
      responses:
        "200":
          description: Immutable revision and exact SHA-256 preview fingerprint
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Revision"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/revisions/{revision_id}/approve:
    post:
      operationId: approveRevision
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalCreate"}
      responses:
        "201":
          description: Exact revision approved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/approvals/{approval_id}/revoke:
    post:
      operationId: revokeApproval
      parameters:
        - {$ref: "#/components/parameters/ApprovalId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalRevoke"}
      responses:
        "200":
          description: Approval revoked or existing revocation returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approval"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/publications/prepare:
    post:
      operationId: preparePublication
      description: Validates current exact approval and creates PREPARED without networking.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicationPrepare"}
      responses:
        "201":
          description: Publication prepared
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Publication"}
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Publication"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/publications/{publication_id}/execute:
    post:
      operationId: executePublication
      description: >
        Executes at most one final post attempt. A timeout, connection reset,
        response loss, or 5xx becomes terminal PUBLISH_UNCERTAIN and is never
        automatically retried.
      parameters:
        - {$ref: "#/components/parameters/PublicationId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicationExecute"}
      responses:
        "200":
          description: Current terminal or in-progress publication state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Publication"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/publications/{publication_id}:
    get:
      operationId: getPublication
      parameters:
        - {$ref: "#/components/parameters/PublicationId"}
      responses:
        "200":
          description: Safe publication state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Publication"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/drafts/{draft_id}/audit:
    get:
      operationId: getDraftAudit
      parameters:
        - {$ref: "#/components/parameters/DraftId"}
      responses:
        "200":
          description: Append-only safe audit history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuditEvent"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/revisions/{revision_id}/external-approval-requests:
    post:
      operationId: createExternalApprovalRequest
      parameters:
        - {$ref: "#/components/parameters/RevisionId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExternalApprovalRequestCreate"}
      responses:
        "201":
          description: Exact external approval request created; callback token returned once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalApprovalRequest"}
        "200":
          description: Idempotent replay without callback token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalApprovalRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/external-approval-requests/{request_id_value}:
    get:
      operationId: getExternalApprovalRequest
      parameters:
        - {$ref: "#/components/parameters/ExternalApprovalRequestId"}
      responses:
        "200":
          description: Safe persisted approval request
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalApprovalRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/external-approval-requests/{request_id_value}/invalidate:
    post:
      operationId: invalidateExternalApprovalRequest
      parameters:
        - {$ref: "#/components/parameters/ExternalApprovalRequestId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExternalApprovalInvalidate"}
      responses:
        "200":
          description: Persisted invalidated request
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalApprovalRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/orchestration/approval-requests/{request_id_value}/preview:
    get:
      security: [{N8NServiceKey: []}]
      operationId: getOrchestrationApprovalPreview
      parameters:
        - {$ref: "#/components/parameters/ExternalApprovalRequestId"}
      responses:
        "200":
          description: Server-built exact Telegram preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TelegramPreview"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/orchestration/approval-decisions:
    post:
      security: [{N8NServiceKey: []}]
      operationId: applyOrchestrationApprovalDecision
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalDecisionCreate"}
      responses:
        "200":
          description: Persisted one-time decision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalDecision"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/orchestration/approval-requests/{request_id_value}/delivery-result:
    post:
      security: [{N8NServiceKey: []}]
      operationId: recordTelegramDeliveryResult
      parameters:
        - {$ref: "#/components/parameters/ExternalApprovalRequestId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TelegramDeliveryResult"}
      responses:
        "200": {description: Delivery result persisted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/orchestration/approval-requests/{request_id_value}/prepare:
    post:
      security: [{N8NServiceKey: []}]
      operationId: prepareOrchestratedPublication
      parameters:
        - {$ref: "#/components/parameters/ExternalApprovalRequestId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrchestrationPrepare"}
      responses:
        "200":
          description: Prepared or replayed publication
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Publication"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/orchestration/publications/{publication_id}/execute:
    post:
      security: [{N8NServiceKey: []}]
      operationId: executeOrchestratedPublication
      parameters:
        - {$ref: "#/components/parameters/PublicationId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrchestrationExecute"}
      responses:
        "200":
          description: Persisted publication result; replay never calls LinkedIn again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Publication"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/orchestration/publications/{publication_id}/result:
    get:
      security: [{N8NServiceKey: []}]
      operationId: getOrchestratedPublicationResult
      parameters:
        - {$ref: "#/components/parameters/PublicationId"}
      responses:
        "200":
          description: Safe persisted publication result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Publication"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  securitySchemes:
    OwnerKey:
      type: apiKey
      in: header
      name: X-Owner-Key
      description: Secret owner credential; the real value is never in OpenAPI.
    Stage0OwnerKey:
      type: apiKey
      in: header
      name: X-Stage0-Owner-Key
    N8NServiceKey:
      type: apiKey
      in: header
      name: X-N8N-Service-Key
      description: Dedicated runtime service credential; never embedded in workflows.
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    DraftId:
      in: path
      name: draft_id
      required: true
      schema: {type: string, format: uuid}
    RevisionId:
      in: path
      name: revision_id
      required: true
      schema: {type: string, format: uuid}
    ApprovalId:
      in: path
      name: approval_id
      required: true
      schema: {type: string, format: uuid}
    PublicationId:
      in: path
      name: publication_id
      required: true
      schema: {type: string, format: uuid}
    ExternalApprovalRequestId:
      in: path
      name: request_id_value
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Invalid request or missing explicit confirmation
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Owner credential missing
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Owner credential invalid or external capability rejected
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Aggregate not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: State, approval, capability, or idempotency conflict
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Health:
      type: object
      required: [status, stage, version]
      properties:
        status: {type: string, const: ok}
        stage: {type: string, const: "1"}
        version: {type: string}
    Readiness:
      type: object
      required: [status, database, migrations, mutations, message]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        database: {type: boolean}
        migrations: {type: boolean}
        mutations: {type: boolean}
        message: {type: string}
    DraftCreate:
      type: object
      additionalProperties: false
      properties:
        title: {type: [string, "null"], maxLength: 300}
    Draft:
      type: object
      required: [id, current_revision_id, created_at, updated_at, archived_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: [string, "null"]}
        current_revision_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, "null"], format: date-time}
    RevisionCreate:
      type: object
      additionalProperties: false
      required: [text, created_by]
      properties:
        text: {type: string, minLength: 1, maxLength: 3000}
        created_by: {type: string, minLength: 1, maxLength: 200}
    Revision:
      type: object
      required:
        [id, draft_id, revision_number, text, text_sha256,
         canonicalization_version, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        draft_id: {type: string, format: uuid}
        revision_number: {type: integer, minimum: 1}
        text: {type: string}
        text_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        canonicalization_version: {type: string, const: utf8-exact-v1}
        supersedes_revision_id: {type: [string, "null"], format: uuid}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    ApprovalCreate:
      type: object
      additionalProperties: false
      required: [approved_by]
      properties:
        approved_by: {type: string, minLength: 1, maxLength: 200}
    ApprovalRevoke:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    Approval:
      type: object
      required:
        [id, revision_id, revision_sha256, approval_fingerprint, approved_by,
         approved_at, created_at]
      properties:
        id: {type: string, format: uuid}
        revision_id: {type: string, format: uuid}
        revision_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        approval_fingerprint: {type: string, pattern: "^[0-9a-f]{64}$"}
        approved_by: {type: string}
        approved_at: {type: string, format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        revocation_reason: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    PublicationPrepare:
      type: object
      additionalProperties: false
      required: [revision_id, approval_id, connection_id]
      properties:
        revision_id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
    PublicationExecute:
      type: object
      additionalProperties: false
      required: [confirm_execute]
      properties:
        confirm_execute: {type: boolean, const: true}
    Publication:
      type: object
      required:
        [id, draft_id, revision_id, approval_id, connection_id, status,
         request_fingerprint, linkedin_post_identifier_present, prepared_at,
         request_attempted, response_received, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        draft_id: {type: string, format: uuid}
        revision_id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        status:
          type: string
          enum: [PREPARED, PUBLISHING, PUBLISHED, FAILED, PUBLISH_UNCERTAIN]
        request_fingerprint: {type: string, pattern: "^[0-9a-f]{64}$"}
        linkedin_post_identifier_present: {type: boolean}
        prepared_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        failure_category: {type: [string, "null"]}
        safe_error_code: {type: [string, "null"]}
        safe_error_message: {type: [string, "null"]}
        request_attempted: {type: boolean}
        response_received: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AuditEvent:
      type: object
      required:
        [id, aggregate_type, aggregate_id, event_type, actor_type, actor_id,
         request_id, occurred_at, safe_metadata]
      properties:
        id: {type: string, format: uuid}
        aggregate_type: {type: string}
        aggregate_id: {type: string, format: uuid}
        event_type: {type: string}
        actor_type: {type: string}
        actor_id: {type: string}
        request_id: {type: string}
        occurred_at: {type: string, format: date-time}
        safe_metadata: {type: object}
    ExternalApprovalRequestCreate:
      type: object
      additionalProperties: false
      properties:
        requested_by: {type: string, minLength: 1, maxLength: 200}
    ExternalApprovalInvalidate:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 300}
    ExternalApprovalRequest:
      type: object
      required:
        [id, draft_id, revision_id, status, channel, revision_sha256_prefix,
         approval_fingerprint, expires_at, replayed]
      properties:
        id: {type: string, format: uuid}
        draft_id: {type: string, format: uuid}
        revision_id: {type: string, format: uuid}
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED, INVALIDATED, CONSUMED]
        channel: {type: string, const: TELEGRAM}
        revision_sha256_prefix: {type: string, minLength: 12, maxLength: 12}
        approval_fingerprint: {type: string, pattern: "^[0-9a-f]{64}$"}
        expires_at: {type: string, format: date-time}
        decision: {type: [string, "null"]}
        approval_id: {type: [string, "null"], format: uuid}
        publication_id: {type: [string, "null"], format: uuid}
        callback_token:
          type: [string, "null"]
          description: Opaque one-time value returned only on initial creation.
        replayed: {type: boolean}
        preview:
          oneOf:
            - {$ref: "#/components/schemas/TelegramPreview"}
            - {type: "null"}
    TelegramPreview:
      type: object
      required:
        [request_id, revision_number, exact_text, text_length,
         revision_sha256_prefix, expires_at, actions, warning]
      properties:
        request_id: {type: string, format: uuid}
        draft_title: {type: [string, "null"]}
        revision_number: {type: integer, minimum: 1}
        exact_text: {type: string}
        text_length: {type: integer, minimum: 1}
        revision_sha256_prefix: {type: string, minLength: 12, maxLength: 12}
        expires_at: {type: string, format: date-time}
        actions:
          type: array
          items: {type: string, enum: [APPROVE_AND_PUBLISH, REJECT]}
        warning: {type: string}
    ApprovalDecisionCreate:
      type: object
      additionalProperties: false
      required:
        [callback_token, telegram_user_id, telegram_chat_id, decision,
         callback_query_id]
      properties:
        callback_token: {type: string, writeOnly: true}
        telegram_user_id: {type: integer}
        telegram_chat_id: {type: integer}
        decision: {type: string, enum: [APPROVE_AND_PUBLISH, REJECT]}
        callback_query_id: {type: string, minLength: 1, maxLength: 200}
        message_external_id: {type: [string, "null"], maxLength: 200}
    ApprovalDecision:
      type: object
      required: [request_id, status, decision, next_action, replayed]
      properties:
        request_id: {type: string, format: uuid}
        status:
          type: string
          enum: [APPROVED, REJECTED, CONSUMED]
        decision: {type: string, enum: [APPROVE_AND_PUBLISH, REJECT]}
        approval_id: {type: [string, "null"], format: uuid}
        publication_id: {type: [string, "null"], format: uuid}
        next_action: {type: string, enum: [PREPARE, STOP, GET_RESULT]}
        replayed: {type: boolean}
    TelegramDeliveryResult:
      type: object
      additionalProperties: false
      required: [phase, delivery_status]
      properties:
        phase: {type: string, enum: [PREVIEW, RESULT]}
        delivery_status: {type: string, enum: [SENT, FAILED]}
        message_external_id: {type: [string, "null"], maxLength: 200}
        safe_error_category: {type: [string, "null"], maxLength: 100}
    OrchestrationPrepare:
      type: object
      additionalProperties: false
      required: [connection_id]
      properties:
        connection_id: {type: string, format: uuid}
    OrchestrationExecute:
      type: object
      additionalProperties: false
      required: [approval_request_id, confirm_execute]
      properties:
